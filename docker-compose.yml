version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: qanunora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qanunora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qanunora_dev}
      POSTGRES_DB: ${POSTGRES_DB:-qanunora}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qanunora} -d ${POSTGRES_DB:-qanunora}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qanunora-network

  redis:
    image: redis:7-alpine
    container_name: qanunora-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_dev}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qanunora-network

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: qanunora-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./apps/backend/.env
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - ./uploads:/app/uploads
    networks:
      - qanunora-network
    profiles:
      - full

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: qanunora-frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - ./apps/frontend/.env
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - qanunora-network
    profiles:
      - full

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  qanunora-network:
    driver: bridge
